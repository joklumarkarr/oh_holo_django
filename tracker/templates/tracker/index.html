{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>oh hi</title>
    <link rel="stylesheet" href="{% static 'tracker/css/styles.css' %}">
</head>
<body>
    <select id="channelSelector" class="select">
        {% for v in vtubers %}
        <option class="selectOption" value="{{ v.slug }}">{{ v.name }}</option>
        {% endfor %}
    </select>

    <div class="image-container">
        <button id="reloadButton">↻</button>
        <img id="clickableImage" src="" alt="" style="object-fit: cover;">
        <a id="channelLink" href="" target="_blank">
            <img id="altClickableImage" src="" alt="" style="object-fit: cover;">
        </a>
    </div>

    <div class="card">
        <div id="subs">
            <h2>Subscribers</h2>
            <p id="subscriberCount">—</p>
        </div>
        <div id="horizontalDivider"></div>
        <div id="views">
            <h2>Total Views</h2>
            <p id="viewCount">—</p>
        </div>
        <div class="clearfix"></div>
    </div>

    <div class="card" id="livestreamDisplay">
        <p class="top-left-text" id="titleDisplay">Title</p>
        <a href="" target="_blank" id="videoThumbnailLink">
            <img src="" class="card-image" id="videoThumbnail" alt="">
        </a>
        <div id="livestreamInfoDisplay">
            <p class="bottom-left-text" id="dateDisplay">Date</p>
            <div id="livestreamButtonDisplay">
                <button class="button" id="premiereBtn">🕔</button>
                <button class="button" id="liveBtn">🔴</button>
                <button class="button" id="completedBtn">🔘</button>
            </div>
        </div>
    </div>

{{ vtubers_json|json_script:"vtuber-state" }}

    <script>
        window.__VTUBER_STATE__ = JSON.parse( document.getElementById("vtuber-state").textContent);

        const state = new Map( window.__VTUBER_STATE__.map(v => [v.slug, v]));

        const select = document.getElementById("channelSelector");
        const img = document.getElementById("clickableImage");
        const altImg = document.getElementById("altClickableImage");
        const channelLink = document.getElementById("channelLink");
        const subs = document.getElementById("subscriberCount");
        const views = document.getElementById("viewCount");
        const titleDisplay = document.getElementById("titleDisplay");
        const dateDisplay = document.getElementById("dateDisplay");
        const thumb = document.getElementById("videoThumbnail");
        const thumbLink = document.getElementById("videoThumbnailLink");
        const premiereBtn = document.getElementById("premiereBtn");
        const liveBtn = document.getElementById("liveBtn");
        const completedBtn = document.getElementById("completedBtn");

        function fmtCount(n) {
            return (n === null || n === undefined) ? "—" : n.toLocaleString();
        }

        function fmtSubs(n) {
            if (n === null || n === undefined) return "—";
            if (n >= 1000000) {
                return (n / 1000000).toFixed(2) + " M";
            } else if (n >= 100000) {
                return (n / 1000) + ' K';
            }
        }

        function showStream(kind, v) {
            const s = v.streams[kind];
            if (!s) return;
            titleDisplay.textContent = s.title;
            dateDisplay.textContent = s.date ? new Date(s.date).toLocaleString() : "";
            thumb.src = s.thumbnail;
            thumbLink.href = s.link || "#";
        }

        function showDefaultStream(v) {
            if (v.streams.live) showStream("live", v);
            else if (v.streams.upcoming) showStream("upcoming", v);
            else if (v.streams.completed) showStream("completed", v);
            else { titleDisplay.textContent = "No stream data yet"; dateDisplay.textContent = ""; thumb.src = ""; }
        }

        function updateButtons(v) {
            premiereBtn.style.display = v.streams.upcoming ? "" : "none";
            liveBtn.style.display = v.streams.live ? "" : "none";
            completedBtn.style.display = v.streams.completed ? "" : "none";
        }

        function applySelection() {
            const v = state.get(select.value);
            document.documentElement.className = v.slug;
            img.src = v.icon_url;
            altImg.src = v.alt_icon_url;
            channelLink.href = v.channel_link;
            subs.textContent = fmtSubs(v.subscribers);
            views.textContent = fmtCount(v.views);
            showDefaultStream(v);
            updateButtons(v);
        }

        function playNoise() {
            const v = state.get(select.value);
            if (!v.noise_url) return;
            const noise = new Audio(v.noise_url);
            noise.volume = 0.5;
            noise.play();
        }

        premiereBtn.addEventListener("click", () => showStream("upcoming", state.get(select.value)));
        liveBtn.addEventListener("click", () => showStream("live", state.get(select.value)));
        completedBtn.addEventListener("click", () => showStream("completed", state.get(select.value)));
        img.addEventListener("click", playNoise);
        select.addEventListener("change", applySelection);
        document.getElementById("reloadButton").addEventListener("click", () => location.reload());

        applySelection();
    </script>
</body>
</html>
